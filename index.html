<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club Core Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.9);
            --terminal-bg: #ffffff;
            --terminal-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            /* Subtle Dot Grid Background */
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* Glassmorphism Panel Styling */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 1.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button.btn-primary {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Terminal Chatbot Styling */
        .terminal-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background-color: #ef4444; }
        .dot.yellow { background-color: #f59e0b; }
        .dot.green { background-color: #10b981; }

        .chat-box {
            flex-grow: 1;
            background: var(--terminal-bg);
            border: 1px solid var(--terminal-border);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            max-height: 400px;
        }

        .message {
            opacity: 0;
            animation: slideUp 0.3s forwards ease-out;
        }

        .message.bot {
            color: var(--text-main);
        }

        .message.bot::before {
            content: "> ";
            color: var(--primary);
            font-weight: bold;
        }

        .message.user {
            color: var(--text-muted);
            text-align: right;
        }

        /* Options inside Chat */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .option-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0.5rem;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Hidden elements initially */
        #chat-input-container {
            display: none;
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        #chat-input-container.hidden {
            display: none !important;
        }

        #chat-input {
            flex-grow: 1;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .chat-box {
                min-height: 350px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Basic Info Form -->
        <div class="glass-panel">
            <h2>Core Recruitment</h2>
            <p class="subtitle">Join the elite tech club. Enter your details below.</p>
            
            <form id="recruitment-form">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" required placeholder="John">
                </div>
                <div class="form-group">
                    <label for="lname">Surname</label>
                    <input type="text" id="lname" required placeholder="Doe">
                </div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn Profile URL</label>
                    <input type="url" id="linkedin" required placeholder="https://linkedin.com/in/johndoe">
                </div>
                <div class="form-group">
                    <label for="github">GitHub Profile URL</label>
                    <input type="url" id="github" required placeholder="https://github.com/johndoe">
                </div>
                <button type="submit" class="btn-primary" id="start-chat-btn">Initialize Interview Process</button>
            </form>
        </div>

        <!-- Right Side: Terminal Chatbot -->
        <div class="glass-panel terminal-container" id="terminal-section" style="opacity: 0.5; pointer-events: none; transition: opacity 0.5s;">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            
            <div class="chat-box" id="chat-box">
                <div class="message bot">System standing by. Awaiting profile submission...</div>
            </div>

            <div id="chat-input-container" class="hidden">
                <input type="text" id="chat-input" placeholder="Type your answer here..." autocomplete="off">
                <button class="btn-primary" style="width: auto; padding: 0.8rem 1.2rem;" onclick="handleUserInput()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('recruitment-form');
        const terminalSection = document.getElementById('terminal-section');
        const chatBox = document.getElementById('chat-box');
        const chatInputContainer = document.getElementById('chat-input-container');
        const chatInput = document.getElementById('chat-input');
        
        let userName = "";
        let selectedRole = "";
        let chatState = 0; // 0 = idle, 1 = awaiting role reason, 2 = hackathon phase

        // Roles configured for the club
        const roles = ["AI / ML Engineer", "Database Administrator", "Python Developer", "Club CEO"];

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            userName = document.getElementById('fname').value;
            
            // Lock form, unlock terminal
            form.querySelectorAll('input, button').forEach(el => el.disabled = true);
            terminalSection.style.opacity = "1";
            terminalSection.style.pointerEvents = "auto";
            
            chatBox.innerHTML = ''; // clear chat
            
            setTimeout(() => addBotMessage(`Profile accepted. Welcome, ${userName}.`), 300);
            setTimeout(() => askForRole(), 1200);
        });

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function askForRole() {
            addBotMessage("Please select the core role you are applying for:");
            
            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'options-grid message'; // added message class for animation
            
            roles.forEach(role => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = role;
                btn.onclick = () => selectRole(role, optionsGrid);
                optionsGrid.appendChild(btn);
            });
            
            chatBox.appendChild(optionsGrid);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function selectRole(role, gridElement) {
            // Remove buttons so they can't be clicked again
            gridElement.remove();
            selectedRole = role;
            
            addUserMessage(`I am applying for: ${role}`);
            
            setTimeout(() => {
                addBotMessage(`Interesting choice. Why do you believe you are the best fit for the ${role} position?`);
                chatInputContainer.classList.remove('hidden');
                chatInput.focus();
                chatState = 1; // Now waiting for text input
            }, 800);
        }

        function handleUserInput() {
            const text = chatInput.value.trim();
            if (!text) return;

            addUserMessage(text);
            chatInput.value = '';
            chatInputContainer.classList.add('hidden'); // hide input while bot "thinks"

            if (chatState === 1) {
                // Bifurcation/Logic phase complete -> move to Hackathon
                setTimeout(() => {
                    addBotMessage("Analyzing response logic... Acceptable.");
                }, 1000);

                setTimeout(() => {
                    addBotMessage(`To finalize your application for ${selectedRole}, we will proceed to the Ideation Hackathon phase.`);
                }, 2500);
                
                setTimeout(() => {
                    addBotMessage("CHALLENGE: You have 24 hours to design an automated system that solves a campus problem using your chosen tech stack. Check your email for repository links and instructions. Good luck.");
                    chatState = 2; // Finished
                }, 4000);
            }
        }

        // Allow pressing Enter to send message
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleUserInput();
            }
        });
    </script>
</body>
</html>
